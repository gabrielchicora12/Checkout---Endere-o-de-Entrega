<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Real: Preenchimento Automático de Morada</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-4">🛒 Checkout - Endereço de Entrega</h3>
                        <p class="text-muted text-center small mb-4">
                            Digite o CEP para preencher os dados de entrega automaticamente via API do ViaCEP.
                        </p>

                        <form id="formCheckout">
                            <!-- Campo do CEP -->
                            <div class="mb-3">
                                <label for="cep" class="form-label fw-bold">CEP:</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="cep" placeholder="Ex: 01001000" maxlength="8" required>
                                    <button type="button" class="btn btn-primary" id="btnBuscar" onclick="buscarCEP()">
                                        Buscar CEP
                                    </button>
                                </div>
                                <div class="form-text" id="statusBusca"></div>
                            </div>

                            <!-- Campos preenchidos automaticamente -->
                            <div class="mb-3">
                                <label for="logradouro" class="form-label">Rua / Logradouro:</label>
                                <input type="text" class="form-control" id="logradouro" placeholder="Aguardando CEP..." readonly>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="bairro" class="form-label">Bairro:</label>
                                    <input type="text" class="form-control" id="bairro" placeholder="Aguardando CEP..." readonly>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="numero" class="form-label fw-bold">Número:</label>
                                    <input type="text" class="form-control" id="numero" placeholder="Ex: 123">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-8 mb-3">
                                    <label for="localidade" class="form-label">Cidade:</label>
                                    <input type="text" class="form-control" id="localidade" placeholder="Aguardando CEP..." readonly>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="uf" class="form-label">Estado (UF):</label>
                                    <input type="text" class="form-control" id="uf" placeholder="UF" readonly>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success w-100 mt-2" onclick="alert('Pedido finalizado com sucesso!'); return false;">
                                Finalizar Encomenda
                            </button>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Função que consome a API real do ViaCEP de forma assíncrona
        async function buscarCEP() {
            const cepInput = document.getElementById("cep").value.trim().replace(/\D/g, '');
            const statusDiv = document.getElementById("statusBusca");
            const btnBuscar = document.getElementById("btnBuscar");

            // Validação simples do formato do CEP (8 dígitos)
            if (cepInput.length !== 8) {
                statusDiv.className = "form-text text-danger";
                statusDiv.innerText = "Por favor, introduza um CEP válido com 8 dígitos.";
                return;
            }

            // Feedback visual de carregamento
            btnBuscar.disabled = true;
            btnBuscar.innerText = "A procurar...";
            statusDiv.className = "form-text text-info";
            statusDiv.innerText = "A consultar a API do ViaCEP...";

            try {
                // Chamada à API real
                const response = await fetch(`https://viacep.com.br/ws/${cepInput}/json/`);
                
                if (!response.ok) {
                    throw new Error("Erro na ligação com o servidor.");
                }

                const data = await response.json();

                // O ViaCEP devolve { erro: true } se o CEP não existir
                if (data.erro) {
                    throw new Error("CEP não encontrado.");
                }

                // Preenchimento automático dos campos do formulário (Manipulação do DOM)
                document.getElementById("logradouro").value = data.logradouro;
                document.getElementById("bairro").value = data.bairro;
                document.getElementById("localidade").value = data.localidade;
                document.getElementById("uf").value = data.uf;

                statusDiv.className = "form-text text-success";
                statusDiv.innerText = "Endereço encontrado e preenchido automaticamente!";

                // Foco direto no campo "Número" para facilitar a navegação do utilizador
                document.getElementById("numero").focus();

            } catch (error) {
                statusDiv.className = "form-text text-danger";
                statusDiv.innerText = error.message;

                // Limpa os campos em caso de erro
                document.getElementById("logradouro").value = "";
                document.getElementById("bairro").value = "";
                document.getElementById("localidade").value = "";
                document.getElementById("uf").value = "";
            } finally {
                btnBuscar.disabled = false;
                btnBuscar.innerText = "Buscar CEP";
            }
        }
    </script>
</body>
</html>
